<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Wusooly POS - Editorial Features Section (AI Studio Standalone Preview)</title>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f6f6f3;
      font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const ASSETS = {
      // Shops & Supermarkets
      retailLifetimeBilling: "./public/images/retail-lifetime-billing.jpg",
      retailLifetimeWallets: "./public/images/retail-lifetime-wallets.jpg",
      retailLifetimeStock: "./public/images/retail-lifetime-stock.jpg",
      retailLifetimePurchase: "./public/images/retail-lifetime-purchase.jpg",
      retailLifetimeReports: "./public/images/retail-lifetime-reports.jpg",
      retailCloudDashboard: "./public/images/retail-cloud-dashboard.jpg",
      retailCloudPromos: "./public/images/retail-cloud-promos.jpg",

      // Cafés & Restaurants
      cafeLifetimeBilling: "./public/images/cafe-lifetime-billing.jpg",
      cafeLifetimeWallets: "./public/images/cafe-lifetime-wallets.jpg",
      cafeLifetimeKot: "./public/images/cafe-lifetime-kot.jpg",
      cafeLifetimeTables: "./public/images/cafe-lifetime-tables.jpg",
      cafeLifetimeStock: "./public/images/cafe-lifetime-stock.jpg",
      cafeLifetimeReports: "./public/images/cafe-lifetime-reports.jpg",
      cafeCloudQrOnline: "./public/images/cafe-cloud-qr-online.jpg",
    };

    function getIntroCopy(audience) {
      if (audience === "retail") {
        return {
          headline: "The essentials to run your store, connected.",
          subtext: "From checkout to stock control and business reporting, manage key retail operations through one POS system.",
          outroTitle: "Ready to see Wusooly in your store?",
        };
      }
      return {
        headline: "Every order. One simple system.",
        subtext: "From table service to takeaway and online ordering, manage billing, kitchen tickets, and business analytics through one unified POS.",
        outroTitle: "Ready to see Wusooly in your café?",
      };
    }

    function validateDemoRequest(input) {
      const name = (input.fullName || "").trim();
      const phone = (input.phone || "").trim();
      if (!name) return { valid: false, error: "Please enter your full name." };
      if (!phone || phone.length < 5) return { valid: false, error: "Please enter a valid phone or WhatsApp number." };
      return { valid: true };
    }

    function EditorialFeaturesStandalone() {
      const [audience, setAudience] = useState("retail");
      const [modalOpen, setModalOpen] = useState(false);
      const [modalTitle, setModalTitle] = useState("Schedule a 1-on-1 Walkthrough");
      const [fullName, setFullName] = useState("");
      const [phone, setPhone] = useState("");
      const [formError, setFormError] = useState(null);
      const [submittedBookings, setSubmittedBookings] = useState([]);
      const [justSubmitted, setJustSubmitted] = useState(null);

      const introCopy = getIntroCopy(audience);

      const handleOpenDemo = (title = "Get a Demo") => {
        setModalTitle(title);
        setFormError(null);
        setJustSubmitted(null);
        setModalOpen(true);
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === "Escape") setModalOpen(false);
        };
        if (modalOpen) {
          document.body.style.overflow = "hidden";
          window.addEventListener("keydown", handleKeyDown);
        } else {
          document.body.style.overflow = "";
        }
        return () => {
          document.body.style.overflow = "";
          window.removeEventListener("keydown", handleKeyDown);
        };
      }, [modalOpen]);

      const handleFormSubmit = (e) => {
        e.preventDefault();
        const validation = validateDemoRequest({ fullName, phone });
        if (!validation.valid) {
          setFormError(validation.error || "Please check your details.");
          return;
        }
        const booking = {
          id: `${Date.now()}`,
          title: modalTitle,
          audience,
          fullName: fullName.trim(),
          phone: phone.trim(),
          submittedAt: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
        };
        setSubmittedBookings((prev) => [booking, ...prev]);
        setJustSubmitted(booking);
        setFullName("");
        setPhone("");
        setFormError(null);
      };

      return (
        <section className="wusooly-editorial-root" id={audience === "retail" ? "features" : "cafe-features"}>
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap');

            .wusooly-editorial-root {
              --w-canvas: #f6f6f3;
              --w-card-bg: #ffffff;
              --w-forest: #081f11;
              --w-forest-dark: #071b0e;
              --w-lime: #9ce62a;
              --w-lime-hover: #aae942;
              --w-text-dark: #0a1f12;
              --w-text-muted: #5a645e;
              --w-border: #e8e8e3;

              --w-gap: 10px;
              font-family: var(--font-sans, "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
              background: var(--w-canvas);
              color: var(--w-text-dark);
              padding: 48px 16px 88px;
              box-sizing: border-box;
              width: 100%;
              -webkit-font-smoothing: antialiased;
            }

            .wusooly-editorial-root * {
              box-sizing: border-box;
              font-family: inherit;
            }

              margin: 0 auto;

              flex-direction: column;
              gap: 28px;
            }

            .w-header-block {

              flex-direction: column;
              align-items: flex-start;
              text-align: left;
              gap: 12px;
              padding: 8px 0 18px;

              width: 100%;
            }

            .w-segmented-control {
              display: inline-flex;
              background: #ecece8;

              padding: 5px;
              border-radius: 9999px;
              gap: 4px;
              align-self: flex-start;
            }

            .w-segment-btn {
              background: transparent;
              border: none;
              padding: 10px 22px;
              border-radius: 9999px;
              font-size: 0.9rem;
              font-weight: 400;
              color: #2c3e32;
              cursor: pointer;
              white-space: nowrap;
              transition: all 0.2s ease;
            }

            .w-segment-btn.active {
              background: var(--w-lime);
              color: var(--w-forest-dark);
              font-weight: 700;
              box-shadow: 0 2px 8px rgba(156, 230, 42, 0.3);

            .w-intro-headline {
              font-size: clamp(2.2rem, 4vw, 3.4rem);
              font-weight: 800;
              line-height: 1.12;
              letter-spacing: -0.025em;
              color: #171717;

              text-align: left;
              max-width: 600px;

            .w-hero-title {

              min-height: 350px;

            }

            .w-visual-card.w-wide-card {

              padding: clamp(28px, 4vw, 44px);
            }

            .w-visual-card.w-tall-card {
              min-height: 510px;
            }

            .w-visual-card.flex-67 { flex: 1; }

          <div className="w-container">
            <header className="w-header-block">
              <div className="w-segmented-control" role="tablist" aria-label="Business Audience">
                <button
                  type="button"

          </div>

          {modalOpen && (
            <div className="w-modal-backdrop" onClick={() => setModalOpen(false)} role="dialog" aria-modal="true">

                <h3 className="w-modal-heading">{modalTitle}</h3>
                <p className="w-modal-desc">Experience the power of Wusooly POS customized for your business.</p>

                {justSubmitted ? (
                  <div className="w-modal-success">

                  <form onSubmit={handleFormSubmit} noValidate>

                    <label className="w-modal-label">

                    </label>
                    <button type="submit" className="w-lime-pill-btn w-full-btn">Request Walkthrough</button>
                  </form>
                )}
              </div>
            </div>
          )}

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<EditorialFeaturesStandalone />);
  </script>
